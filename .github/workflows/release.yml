name: Release

# Builds and publishes MXB Servers (MSM) and the native Linux mxbserver to this repo's releases.
#
# The source is in the private Frostn1/mxbserver repo (MSM is `apps/msm` there). Actions does
# not run on that repo, so this workflow checks it out with a read-only deploy key
# (MXBSERVER_DEPLOY_KEY), builds it and attaches only the built files to a release here.
#
#   msm-v0.1.0      → MSM Windows installer (NSIS), Authenticode-signed, plus the updater's
#                     signature (.sig) and a signed latest.json
#   server-v0.1.0   → mxbserver Linux x86-64 binary, VERSION and SHA256SUMS
#   agent-v0.1.0    → mxb-agent: Windows x64 exe (Authenticode-signed), a zip of it with
#                     install.ps1, a Linux x86-64 binary, and SHA256SUMS over all three
#
# A suffixed tag (msm-v0.2.0-beta.1) is published as a pre-release.
#
# MSM's updater does not read `releases/latest`: server-v* releases share this repo, and
# GitHub's "latest" is whichever non-prerelease was published last. The app lists this repo's
# releases and takes the newest `msm-v` tag that carries a latest.json (stable, or beta when
# the user opts in), as MXB Coach does in Frostn1/mxb-coach. So every MSM release carries its
# own latest.json, and a server release can never stand in for one.
#
# Which source commit gets built: the commit tagged with the same name in Frostn1/mxbserver
# when that tag exists there, else the tip of its main branch. The release notes name the commit.
#
# This repo is public and so are these logs. Nothing here prints source: no `set -x`, no
# `cat` of checked-out files, no workflow artifacts, no build cache (a cache would hold
# compiled private code). The release gets the installer or the binary, never the checkout.

on:
  push:
    tags:
      - "msm-v*"
      - "server-v*"
      - "agent-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  msm:
    name: MXB Servers (Windows)
    if: ${{ startsWith(github.ref_name, 'msm-v') }}
    runs-on: windows-latest
    # The environment gives the OIDC token one stable subject for Azure to trust
    # (repo:Frostn1/mxbserver-releases:environment:code-signing), whatever tag started the run.
    # No protection rules: it exists only to name the job. See README.md.
    environment: code-signing
    permissions:
      contents: write # publish the release in this repo with GITHUB_TOKEN
      id-token: write # OIDC login for code signing
    steps:
      # This repo: the signing action and scripts/sign-windows.ps1.
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout mxbserver (private)
        uses: actions/checkout@v4
        with:
          repository: Frostn1/mxbserver
          ssh-key: ${{ secrets.MXBSERVER_DEPLOY_KEY }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the source commit and version
        id: meta
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#msm-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not msm-v<major>.<minor>.<patch>[-pre]"
            exit 1
          fi
          if git -C src rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            git -C src checkout -q --detach "refs/tags/$TAG"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

      # The installer's version comes from the tag, not whatever tauri.conf.json says. The
      # updater artifacts (.sig, latest.json) are switched on here rather than in the source's
      # tauri.conf.json, so a local `tauri build` without the private key still works. A release
      # must not ship the pubkey placeholder: that build could never verify an update
      # (apps/msm/src-tauri/build.rs refuses it too).
      - name: Stamp the version and turn on updater artifacts
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "src/apps/msm/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            const key = c.plugins && c.plugins.updater && c.plugins.updater.pubkey;
            if (!key || key === "MSM_UPDATER_PUBKEY_PLACEHOLDER") {
              console.log("::error::plugins.updater.pubkey in apps/msm/src-tauri/tauri.conf.json is still the placeholder. Commit the MSM updater public key before tagging.");
              process.exit(1);
            }
            c.version = process.env.VERSION;
            c.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '

      # Without the updater key, tauri build fails late or a release ships with no .sig. Checked
      # by presence only; the value is never printed.
      - name: Check the updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.MSM_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::error::secret MSM_SIGNING_PRIVATE_KEY is not set (see README.md)"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: src/apps/msm
        run: bun install --frozen-lockfile

      # A tag must never publish an unsigned installer: without the Azure secrets and variables
      # this step fails the job.
      - name: Set up Windows code signing
        id: signing
        uses: ./.github/actions/artifact-signing
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          profile: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          required: "true"

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          # Publishes to this same repo, so the job's own token is enough.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_NAME: "MXB Servers"
          # MSM's own updater key, as the Coach has its own: a leak here signs no other app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MSM_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MSM_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the binary (apps/msm/src-tauri/build.rs) so the updater compares tags.
          MXB_RELEASE_TAG: ${{ github.ref_name }}
        with:
          projectPath: src/apps/msm
          tauriScript: bun run tauri
          tagName: ${{ github.ref_name }}
          releaseName: "MXB Servers ${{ steps.meta.outputs.version }}"
          # Named here rather than renamed afterwards: this applies before latest.json is
          # written, so the manifest and the assets cannot disagree.
          assetNamePattern: "MXB-Servers-[version]-[arch][ext]"
          # The signed manifest MSM's updater reads, attached to this release.
          includeUpdaterJson: true
          releaseBody: |
            MXB Servers ${{ steps.meta.outputs.version }}: the desktop manager for mxbserver.

            Download `MXB-Servers-${{ steps.meta.outputs.version }}-x64-setup.exe` and run it (Windows 10/11, x64). The installer is signed by Creste LLC.

            Built from mxbserver `${{ steps.meta.outputs.sha }}`.
          releaseDraft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          # The signCommand overlay from the signing step.
          args: ${{ steps.signing.outputs.tauri-args }}

      # Tauri hides the signing command's output when it fails; sign-windows.ps1 keeps a transcript.
      - name: Show Windows signing log
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'sign-windows.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Host 'no sign-windows.log (the signing script never ran)' }

  server:
    name: mxbserver (Linux x86-64)
    if: ${{ startsWith(github.ref_name, 'server-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release in this repo with GITHUB_TOKEN
    steps:
      # This repo: minisign.pub, to check our own signature.
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout mxbserver (private)
        uses: actions/checkout@v4
        with:
          repository: Frostn1/mxbserver
          ssh-key: ${{ secrets.MXBSERVER_DEPLOY_KEY }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      # Checked by presence only; the values are never printed.
      - name: Check the minisign key
        env:
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::error::secret MINISIGN_SECRET_KEY is not set (see README.md)"
            exit 1
          fi
          if [[ -z "$PASSWORD" ]]; then
            echo "::error::secret MINISIGN_PASSWORD is not set (see README.md)"
            exit 1
          fi

      - name: Pick the source commit and version
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#server-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not server-v<major>.<minor>.<patch>[-pre]"
            exit 1
          fi
          if git -C src rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            git -C src checkout -q --detach "refs/tags/$TAG"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # --quiet: one character per test, so the public log carries no list of test names.
      - name: Test
        working-directory: src
        run: cargo test --workspace --locked --quiet

      - name: Build
        working-directory: src
        run: cargo build --release --locked -p mxbserver

      - name: Package
        run: |
          mkdir dist
          elf=mxbserver-x86_64-unknown-linux-gnu.elf
          cp src/target/release/mxbserver "dist/$elf"
          file "dist/$elf" | grep -q 'ELF 64-bit.*x86-64'
          "dist/$elf" --version > dist/VERSION
          (cd dist && sha256sum "$elf" VERSION > SHA256SUMS)
          # Bike-set manifests: ids and check words only, no licensed payload. Box installs take
          # them from here. They are listed in SHA256SUMS, so the signature covers them.
          if compgen -G "src/config/bike-sets/*.toml" >/dev/null; then
            cp src/config/bike-sets/*.toml dist/
            (cd dist && sha256sum oem-*.toml >> SHA256SUMS)
          fi
          cat dist/VERSION dist/SHA256SUMS

      # SHA256SUMS.minisig is the signature `mxbserver ctl update` expects: it must verify under
      # the release key and carry the trusted comment `mxbserver <tag> <commit>`. The key and
      # password go through files and stdin only: no echo, no set -x, removed afterwards.
      - name: Sign
        env:
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set +x
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign >/dev/null
          keyfile="$RUNNER_TEMP/minisign.key"
          (umask 077; printf '%s\n' "$KEY" > "$keyfile")
          trap 'rm -f "$keyfile"' EXIT
          elf=mxbserver-x86_64-unknown-linux-gnu.elf
          comment="mxbserver $TAG $SHA"
          for f in SHA256SUMS "$elf"; do
            printf '%s\n' "$PASSWORD" | minisign -S -s "$keyfile" -m "dist/$f" -x "dist/$f.minisig" \
              -c "mxbserver release signature" -t "$comment" >/dev/null
          done
          if [[ -f minisign.pub ]]; then
            minisign -V -p minisign.pub -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig >/dev/null
            minisign -V -p minisign.pub -m "dist/$elf" -x "dist/$elf.minisig" >/dev/null
            echo "signatures verify against minisign.pub"
          else
            echo "::warning::minisign.pub is not committed; signatures were not self-checked"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          notes="mxbserver $VERSION for Linux x86-64 ($(cat dist/VERSION)). Built from mxbserver \`$SHA\`. Check the download with \`sha256sum -c SHA256SUMS\` and \`minisign -V -p minisign.pub -m SHA256SUMS\`."
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "mxbserver $VERSION" \
            --notes "$notes" \
            "${flags[@]}" \
            dist/mxbserver-x86_64-unknown-linux-gnu.elf dist/mxbserver-x86_64-unknown-linux-gnu.elf.minisig             dist/VERSION dist/SHA256SUMS dist/SHA256SUMS.minisig dist/*.toml

  # mxb-agent (apps/agent in the source). The Windows job builds and signs the exe, packs the
  # zip, and creates the release as a draft; the Linux job adds its binary and SHA256SUMS over
  # every file, then publishes it. MSM only takes a published release that has SHA256SUMS, so a
  # half-made release is never installed. The tag's version must match apps/agent/Cargo.toml.
  agent-windows:
    name: mxb-agent (Windows x64)
    if: ${{ startsWith(github.ref_name, 'agent-v') }}
    runs-on: windows-latest
    environment: code-signing
    permissions:
      contents: write # create the release in this repo with GITHUB_TOKEN
      id-token: write # OIDC login for code signing
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout mxbserver (private)
        uses: actions/checkout@v4
        with:
          repository: Frostn1/mxbserver
          ssh-key: ${{ secrets.MXBSERVER_DEPLOY_KEY }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the source commit and version
        id: meta
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#agent-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not agent-v<major>.<minor>.<patch>[-pre]"
            exit 1
          fi
          if git -C src rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            git -C src checkout -q --detach "refs/tags/$TAG"
          fi
          crate=$(grep -m1 '^version = ' src/apps/agent/Cargo.toml | cut -d'"' -f2)
          if [[ "$crate" != "$version" ]]; then
            echo "::error::apps/agent/Cargo.toml says $crate; bump it (and Cargo.lock) to $version before tagging"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # --quiet: one character per test, so the public log carries no list of test names.
      - name: Test
        working-directory: src/apps/agent
        run: cargo test --locked --quiet

      - name: Build
        working-directory: src/apps/agent
        run: cargo build --release --locked --bin mxb-agent

      - name: Set up Windows code signing
        uses: ./.github/actions/artifact-signing
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          profile: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          required: "true"

      # The exe is signed before it is zipped and hashed, so the zip and SHA256SUMS carry the
      # signed bytes. A release never ships an unsigned agent.
      - name: Sign and package
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          New-Item -ItemType Directory dist, pack | Out-Null
          Copy-Item src/apps/agent/target/release/mxb-agent.exe dist/mxb-agent-windows-x64.exe
          ./scripts/sign-windows.ps1 dist/mxb-agent-windows-x64.exe
          $sig = Get-AuthenticodeSignature dist/mxb-agent-windows-x64.exe
          if ($sig.Status -ne 'Valid') { throw "mxb-agent-windows-x64.exe is not validly signed: $($sig.Status)" }
          Copy-Item dist/mxb-agent-windows-x64.exe pack/mxb-agent.exe
          Copy-Item src/apps/agent/dist/install.ps1 pack/install.ps1
          @"
          mxb-agent $env:VERSION for Windows x64

          Run install.ps1 (right-click > Run with PowerShell, or:
            powershell -ExecutionPolicy Bypass -File install.ps1 -GameDir "C:\MX Bikes" -OpenFirewall)
          It installs the mxb-agent service and prints a pairing line (mxb-agent:...).
          Paste that line into MXB Servers: Edit server > mxb-agent > Remote Desktop.
          "@ | Set-Content -Encoding utf8 pack/README.txt
          Compress-Archive -Path pack/* -DestinationPath dist/mxb-agent-windows-x64.zip

      - name: Create the release (draft)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          notes="mxb-agent $VERSION: runs an MX Bikes dedicated server and lets MXB Servers manage it (track changes, track uploads, dedicated.ini, logs, start/stop). Windows: \`mxb-agent-windows-x64.zip\` (signed by Creste LLC, with install.ps1). Linux x86-64: \`mxb-agent-linux-x86_64\` (\`sudo ./mxb-agent-linux-x86_64 install --game-dir <folder>\`). MXB Servers can install it for you (Edit server > mxb-agent). Check downloads with \`sha256sum -c SHA256SUMS\`. Built from mxbserver \`$SHA\`."
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "mxb-agent $VERSION" \
            --notes "$notes" \
            "${flags[@]}" \
            dist/mxb-agent-windows-x64.exe dist/mxb-agent-windows-x64.zip

      - name: Show Windows signing log
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'sign-windows.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Host 'no sign-windows.log (the signing script never ran)' }

  agent-linux:
    name: mxb-agent (Linux x86-64) and publish
    needs: agent-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write # add to and publish the release with GITHUB_TOKEN
    steps:
      - name: Checkout mxbserver (private)
        uses: actions/checkout@v4
        with:
          repository: Frostn1/mxbserver
          ssh-key: ${{ secrets.MXBSERVER_DEPLOY_KEY }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the source commit
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.agent-windows.outputs.sha }}
        run: |
          git -C src checkout -q --detach "$SHA"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        working-directory: src/apps/agent
        run: cargo test --locked --quiet

      - name: Build
        working-directory: src/apps/agent
        run: cargo build --release --locked --bin mxb-agent

      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp src/apps/agent/target/release/mxb-agent dist/mxb-agent-linux-x86_64
          file dist/mxb-agent-linux-x86_64 | grep -q 'ELF 64-bit.*x86-64'
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern mxb-agent-windows-x64.exe --pattern mxb-agent-windows-x64.zip
          (cd dist && sha256sum mxb-agent-windows-x64.exe mxb-agent-windows-x64.zip mxb-agent-linux-x86_64 > SHA256SUMS)
          cat dist/SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/mxb-agent-linux-x86_64 dist/SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
