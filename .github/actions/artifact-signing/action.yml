# Windows code signing through Azure Artifact Signing (formerly Trusted Signing).
#
# Copied from Frostn1/mxb-app, where the MXB App, Studio and Coach releases use it. Run it on the
# Windows leg before `tauri build`, then pass its `tauri-args` output to the build: that adds a
# `bundle.windows.signCommand` overlay, so Tauri itself signs the app exe, the NSIS installer
# and its uninstaller while it bundles. Signing has to happen there rather than after the
# build: the updater's signature in latest.json is taken over the installer as it's bundled,
# and signing the file afterwards would change the bytes it vouches for.
#
# Anything else that ships and needs a signature is signed by running
# `scripts/sign-windows.ps1 <file>` after this action, before bundling.
#
# Without every input set (the secrets and variables in README.md), it logs a notice
# and does nothing: `enabled` is "false", `tauri-args` is empty, and sign-windows.ps1 skips, so a
# build without the Azure account still goes green, unsigned, as today.
#
# The calling job needs `permissions: id-token: write` for the OIDC login.

name: Artifact Signing (Windows)
description: Log in to Azure over OIDC and set up SignTool with the Artifact Signing client.

inputs:
  azure-client-id:
    description: App registration (client) id with a federated credential for this repo.
    required: false
  azure-tenant-id:
    description: Microsoft Entra tenant id.
    required: false
  azure-subscription-id:
    description: Subscription holding the Artifact Signing account.
    required: false
  endpoint:
    description: Regional endpoint of the account, e.g. https://wus2.codesigning.azure.net
    required: false
  account:
    description: Artifact Signing account name.
    required: false
  profile:
    description: Certificate profile name (Public Trust).
    required: false
  required:
    description: Fail instead of producing an unsigned build when signing is not configured.
    required: false
    default: 'false'

outputs:
  enabled:
    description: '"true" when signing is set up for this job.'
    value: ${{ steps.check.outputs.enabled }}
  tauri-args:
    description: Extra `tauri build` arguments (the signCommand overlay), or empty.
    value: ${{ steps.setup.outputs.tauri-args }}

runs:
  using: composite
  steps:
    - name: Check signing configuration
      id: check
      shell: bash
      env:
        CLIENT: ${{ inputs.azure-client-id }}
        TENANT: ${{ inputs.azure-tenant-id }}
        SUBSCRIPTION: ${{ inputs.azure-subscription-id }}
        ENDPOINT: ${{ inputs.endpoint }}
        ACCOUNT: ${{ inputs.account }}
        PROFILE: ${{ inputs.profile }}
        REQUIRED: ${{ inputs.required }}
      run: |
        missing=()
        [ -n "$CLIENT" ] || missing+=(AZURE_CLIENT_ID)
        [ -n "$TENANT" ] || missing+=(AZURE_TENANT_ID)
        [ -n "$SUBSCRIPTION" ] || missing+=(AZURE_SUBSCRIPTION_ID)
        [ -n "$ENDPOINT" ] || missing+=(ARTIFACT_SIGNING_ENDPOINT)
        [ -n "$ACCOUNT" ] || missing+=(ARTIFACT_SIGNING_ACCOUNT)
        [ -n "$PROFILE" ] || missing+=(ARTIFACT_SIGNING_PROFILE)
        if [ "${#missing[@]}" -gt 0 ]; then
          if [ "$REQUIRED" = 'true' ]; then
            echo "::error title=Windows code signing is required::A release tag cannot publish unsigned. Configure: ${missing[*]}. See README.md."
            exit 1
          fi
          echo "::notice title=Windows code signing skipped::Not configured (missing: ${missing[*]}). This build is unsigned. See README.md."
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Azure login (OIDC)
      if: steps.check.outputs.enabled == 'true'
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Install SignTool and the Artifact Signing client
      id: setup
      if: steps.check.outputs.enabled == 'true'
      shell: pwsh
      env:
        ENDPOINT: ${{ inputs.endpoint }}
        ACCOUNT: ${{ inputs.account }}
        PROFILE: ${{ inputs.profile }}
        AZ_CLIENT: ${{ inputs.azure-client-id }}
        AZ_TENANT: ${{ inputs.azure-tenant-id }}
        AZ_SUBSCRIPTION: ${{ inputs.azure-subscription-id }}
        # Pinned so a release doesn't change tools under it. SignTool must be 10.0.2261.755 or
        # newer (Artifact Signing's requirement); the client is the dlib SignTool loads.
        SDK_BUILDTOOLS_VERSION: 10.0.28000.2705
        SIGNING_CLIENT_VERSION: 1.0.128
      run: |
        $ErrorActionPreference = 'Stop'
        $root = Join-Path $env:RUNNER_TEMP 'artifact-signing'
        New-Item -ItemType Directory -Force $root | Out-Null
        nuget install Microsoft.Windows.SDK.BuildTools -Version $env:SDK_BUILDTOOLS_VERSION -OutputDirectory $root -ExcludeVersion -NonInteractive | Out-Null
        nuget install Microsoft.ArtifactSigning.Client -Version $env:SIGNING_CLIENT_VERSION -OutputDirectory $root -ExcludeVersion -NonInteractive | Out-Null
        $signtool = Get-ChildItem "$root\Microsoft.Windows.SDK.BuildTools" -Recurse -Filter signtool.exe |
          Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
        $dlib = Get-ChildItem "$root\Microsoft.ArtifactSigning.Client" -Recurse -Filter Azure.CodeSigning.Dlib.dll |
          Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
        if (-not $signtool) { throw 'signtool.exe (x64) not found in Microsoft.Windows.SDK.BuildTools' }
        if (-not $dlib) { throw 'Azure.CodeSigning.Dlib.dll (x64) not found in Microsoft.ArtifactSigning.Client' }

        # Only the Azure CLI credential: azure/login above left an OIDC session there, and every
        # other credential in the chain would just be tried and fail first.
        $metadata = [ordered]@{
          Endpoint               = $env:ENDPOINT
          CodeSigningAccountName = $env:ACCOUNT
          CertificateProfileName = $env:PROFILE
          CorrelationId          = "$env:GITHUB_REPOSITORY@$env:GITHUB_RUN_ID"
          ExcludeCredentials     = @(
            'EnvironmentCredential', 'ManagedIdentityCredential', 'WorkloadIdentityCredential',
            'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
            'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
          )
        }
        $metadataPath = Join-Path $root 'metadata.json'
        $metadata | ConvertTo-Json | Set-Content -Path $metadataPath -Encoding utf8

        # What scripts/sign-windows.ps1 reads.
        "ARTIFACT_SIGNING=1" | Add-Content $env:GITHUB_ENV
        "ARTIFACT_SIGNING_SIGNTOOL=$($signtool.FullName)" | Add-Content $env:GITHUB_ENV
        "ARTIFACT_SIGNING_DLIB=$($dlib.FullName)" | Add-Content $env:GITHUB_ENV
        "ARTIFACT_SIGNING_METADATA=$metadataPath" | Add-Content $env:GITHUB_ENV
        # The login above uses a GitHub OIDC assertion that is only valid for a few minutes, and
        # a release builds for ~10 minutes before Tauri signs. sign-windows.ps1 therefore logs in
        # again with a fresh token before each signing, from these ids (not secrets).
        "AZURE_CLIENT_ID=$env:AZ_CLIENT" | Add-Content $env:GITHUB_ENV
        "AZURE_TENANT_ID=$env:AZ_TENANT" | Add-Content $env:GITHUB_ENV
        "AZURE_SUBSCRIPTION_ID=$env:AZ_SUBSCRIPTION" | Add-Content $env:GITHUB_ENV

        # The overlay `tauri build --config` merges in: Tauri runs this for every binary it
        # signs, with %1 standing for the file.
        $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\sign-windows.ps1'
        $overlay = @{
          bundle = @{
            windows = @{
              signCommand = @{
                cmd  = 'pwsh'
                args = @('-NoProfile', '-NonInteractive', '-File', $script, '%1')
              }
            }
          }
        }
        $overlayPath = Join-Path $root 'tauri.signing.json'
        $overlay | ConvertTo-Json -Depth 6 | Set-Content -Path $overlayPath -Encoding utf8
        "tauri-args=--config $overlayPath" | Add-Content $env:GITHUB_OUTPUT
        Write-Host "Artifact Signing ready: $($signtool.FullName)"
